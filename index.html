<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d97706" />
    <title>BayRan — Construction project management</title>
    <meta
      name="description"
      content="Run every job from one place: schedules, selections, materials, subs, and payments, across every active project."
    />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applies a saved "light" preference before first paint, so there's no
      // flash of the wrong theme. Dark is the default with no class needed.
      try {
        if (localStorage.getItem("bayran-theme") === "light") {
          document.documentElement.classList.add("light");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
